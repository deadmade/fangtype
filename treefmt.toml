[formatter.ruff]
command = "ruff"
options = ["format"]
includes = ["*.py"]
excludes = ["code/lsp/benchmark/data/", "**/__pycache__/", "*.pyc"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.json", "*.yaml", "*.yml", "*.js", "*.ts"]
excludes = [
  "code/vscode-extension/node_modules/",
  "code/vscode-extension/dist/",
  "flake.lock",
]

[formatter.taplo]
command = "taplo"
options = ["format"]
includes = ["*.toml"]

[formatter.alejandra]
command = "alejandra"
options = []
includes = ["*.nix"]
excludes = ["flake.lock"]
