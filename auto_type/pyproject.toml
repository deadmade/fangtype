[project]
name = "auto-type"
version = "0.3.0"
description = "Python automatic type inference tool"
authors = [{ name = "deadmade" }]
requires-python = ">=3.14"
dependencies = [
  "pygls==2.0.1",
  "libcst==1.8.6",
  "mypy==1.17.1",
  "jedi==0.19.2",
  "injector==0.22.0",
]

[project.scripts]
auto-type-server = "auto_type.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "pytest-cov>=7.0.0",
  "pytest-asyncio>=1.3.0",
  "pytest-mock>=3.15.1",
]
build = [
  "setuptools==69.5.1",
  "wheel==0.46.3",
  "pyinstaller==6.18.0",
  "pyinstaller-hooks-contrib==2026.0",
  "staticx==0.14.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["auto_type/tests"]
pythonpath = ["auto_type/src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=auto_type",
  "--cov-report=term-missing",
  "--cov-report=html",
]
norecursedirs = [
  ".direnv",
  ".gitlab-ci-local",
  "vscode-extension",
  "auto_type/benchmark",
  "auto_type/benchmark/data",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = [
  "benchmark/data/",
  "src/test/fixtures/",
  "../../vscode-extension/src/test/fixtures/large-test-files/",
  "**/../../vscode-extension/src/test/fixtures/large-test-files/*.py",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
  "TCH", # flake8-type-checking
  "PTH", # flake8-use-pathlib
  "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", # Allow assert in tests
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_globals = true
disallow_any_unimported = false
disallow_any_explicit = true
disallow_any_generics = true
disallow_any_expr = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
enable_error_code = ["var-annotated"]
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_subclassing_any = true
warn_unreachable = true
no_implicit_reexport = true
extra_checks = true
exclude = [
  "^benchmark/data/*",
  "^src/test/fixtures/",
  "^vscode-extension/",
  "^../vscode-extension/test/fixtures/",
  "test/fixtures/",
  ".*/test/fixtures/.*",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_globals = false
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
disable_error_code = ["type-abstract", "attr-defined"]

[[tool.mypy.overrides]]
module = ["jedi", "jedi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"]
ignore_missing_imports = true

# Protocol types with injector.get() trigger type-abstract errors
# This is a known limitation when using Protocols for DI
[[tool.mypy.overrides]]
module = ["auto_type.server", "server"]
disallow_untyped_decorators = false
warn_return_any = false
disallow_any_expr = false
disallow_any_explicit = false
disallow_any_generics = false
disable_error_code = ["type-abstract", "import-untyped", "unreachable"]

# Files using external libraries with injector DI
[[tool.mypy.overrides]]
module = [
  "auto_type",
  "auto_type.*",
  "libcst",
  "libcst.*",
  "lsprotocol",
  "lsprotocol.*",
  "pygls",
  "pygls.*",
  "injector",
  "injector.*",
]
ignore_missing_imports = true

# Files that use external libraries with ignored imports - allow subclassing Any
[[tool.mypy.overrides]]
module = "auto_type.insertion.*"
disallow_subclassing_any = false

# Files that use injector dependency injection
[[tool.mypy.overrides]]
module = "auto_type.container"
disallow_subclassing_any = false
disallow_untyped_decorators = false

# Utility modules with decorators
[[tool.mypy.overrides]]
module = ["auto_type.utils.*", "auto_type.diagnostics.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
  "auto_type.container",
  "auto_type.diagnostics.diagnostic_engine",
  "auto_type.inference.call_flow_inference",
  "auto_type.inference.jedi_type_formatter",
  "auto_type.insertion.engine",
  "auto_type.insertion.target_factory",
  "auto_type.insertion.transformer",
  "auto_type.protocols.type_validator_protocol",
  "auto_type.protocols.workflow_protocol",
  "auto_type.utils.*",
  "auto_type.validation.mypy_validator",
  "auto_type.workflow",
]
disallow_any_expr = false
disallow_any_explicit = false
disallow_any_generics = false
disable_error_code = ["unreachable"]

# Test fixtures - these intentionally have type errors for testing purposes
[[tool.mypy.overrides]]
module = [
  "container_types",
  "error_cases",
  "test_oop_advanced",
  "test_type_errors",
  "test_container",
  "test_jedi_inference",
  "test_new_strategies",
]
ignore_errors = true

# Jedi-related files with missing stubs
[[tool.mypy.overrides]]
module = [
  "auto_type.inference.jedi_scope_builder",
  "auto_type.inference.jedi_project",
  "auto_type.inference.jedi_engine",
  "jedi_scope_builder",
  "jedi_project",
  "jedi_engine",
]
ignore_missing_imports = true
disallow_any_expr = false
disallow_any_explicit = false
disallow_any_generics = false
disable_error_code = ["import-untyped", "unreachable"]

# Benchmark files with Protocol DI issues
[[tool.mypy.overrides]]
module = ["benchmark.insertion.runner", "benchmark.*"]
disable_error_code = ["type-abstract", "attr-defined"]
disallow_untyped_defs = false

[tool.isort]
profile = "black"
line_length = 100
