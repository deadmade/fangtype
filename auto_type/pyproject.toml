[project]
name = "auto-type"
version = "0.2.0"
description = "Python automatic type inference tool"
authors = [
    { name = "deadmade" }
]
requires-python = ">=3.12"
dependencies = [
    "pygls>=2.0.0",
    "libcst>=1.8.0",
    "mypy>=1.17.0",
    "jedi>=0.19.2",
    "injector>=0.22.0",
]

[project.scripts]
auto-type-server = "auto_type.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=auto_type",
    "--cov-report=term-missing",
    "--cov-report=html",
]
# Exclude benchmark data from test collection
norecursedirs = ["tests/benchmarks/data"]
# pytest-asyncio configuration
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "tests/benchmarks/data/",
    "tests/extension-test-files/",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # ruff-specific rules
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Allow assert in tests
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "^tests/benchmarks/data/",
    "^tests/extension-test-files/",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
disable_error_code = ["type-abstract", "attr-defined"]

[[tool.mypy.overrides]]
module = ["jedi", "jedi.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "pytest.*"]
ignore_missing_imports = true

# Protocol types with injector.get() trigger type-abstract errors
# This is a known limitation when using Protocols for DI
[[tool.mypy.overrides]]
module = "auto_type.server"
disable_error_code = ["type-abstract"]

[tool.isort]
profile = "black"
line_length = 100
