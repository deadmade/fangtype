[mypy]
python_version = 3.12
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = (?x)(
    tests/benchmarks/data/
    | tests/extension-test-files/
    | \.gitlab-ci-local/
    | test_type_errors\.py$
    | test_inlay_hints\.py$
    | propagation\.py$
  )

[mypy-tests.*]
disallow_untyped_defs = false
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
disable_error_code = type-abstract, attr-defined

[mypy-pytest]
ignore_missing_imports = true

[mypy-pytest.*]
ignore_missing_imports = true

[mypy-auto_type]
ignore_missing_imports = true

[mypy-auto_type.*]
ignore_missing_imports = true

[mypy-jedi]
ignore_missing_imports = true

[mypy-jedi.*]
ignore_missing_imports = true

[mypy-libcst]
ignore_missing_imports = true

[mypy-libcst.*]
ignore_missing_imports = true

[mypy-lsprotocol]
ignore_missing_imports = true

[mypy-lsprotocol.*]
ignore_missing_imports = true

[mypy-pygls]
ignore_missing_imports = true

[mypy-pygls.*]
ignore_missing_imports = true

[mypy-injector]
ignore_missing_imports = true

[mypy-injector.*]
ignore_missing_imports = true

# Files that use external libraries with ignored imports - allow subclassing Any
[mypy-auto_type.insertion.*]
disallow_subclassing_any = false

[mypy-auto_type.server]
disallow_untyped_decorators = false
warn_return_any = false
disable_error_code = type-abstract

# Files that use injector dependency injection
[mypy-auto_type.container]
disallow_subclassing_any = false
disallow_untyped_decorators = false

[mypy-auto_type.utils.*]
disallow_untyped_decorators = false

[mypy-auto_type.diagnostics.*]
disallow_untyped_decorators = false
