name: release

on:
  push:
    tags: ["*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install nox pip-tools
      # The bundle is pure-Python (fangtype only), so this VSIX is universal:
      # any OS + any CPython 3.x. No --target.
      - name: Build universal VSIX
        working-directory: code/vscode-extension
        run: |
          nox -s setup
          npm ci
          npm run build
          npx vsce package --out fangtype.vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: code/vscode-extension/fangtype.vsix

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: Release ${{ github.ref_name }}
          files: dist/*.vsix
